# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    # core backend / software
    - '\b(software|backend|back-end|server|platform|infrastructure|infra|systems|distributed|cloud|api)\b.*\bengineer\b'
    - '\bengineer\b.*\b(backend|back-end|platform|infrastructure|infra|distributed|api)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'full[\s-]?stack'
    - 'member of technical staff'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'devops engineer'
    # data track — Airflow, Postgres, Tableau, data-quality work
    - 'data engineer'
    - 'analytics engineer'
    - 'data platform'
    # AI / ML track — PyTorch, Hugging Face, DistilBERT, FlowDesk AI
    - '\b(machine learning|ml|ai|applied ai|genai|llm)\s+engineer'   # \b fixes "HTML Engineer" false match
    - '\bengineer\b.*\b(machine learning|ml|ai|llm)\b'
    - 'forward deployed (software )?engineer'
    # early-career labels that don't always say "engineer"
    - 'new grad'
    - 'early career'
    - 'university grad'
    - 'emerging talent'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'      # too senior
    # Senior roles screen at 4-5+ years. Delete these two lines if you want to
    # stretch-apply once you have more full-time experience.
    - '\bsenior\b'
    - '\bsr\.?\b'
    # Mid-level numbered titles (Software Engineer II/III, SDE 2, L2/L3) usually
    # want 3+ years. Level I / New Grad still passes.
    - '\bengineer[\s,]*(ii|iii|iv|2|3|4)\b'
    - '\bsde\s*-?\s*(ii|iii|iv|[234])\b'
    - '\(?\bl[2-9]\b\)?'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|apprenticeship|trainee|co-op)\b'  # you've graduated
    - '\b(contract|contractor|temporary|part-time|freelance|consultant)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|designer)\b'       # backend/full-stack only
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(security|solutions|sales|customer|field|hardware|test|qa) engineer\b'  # wrong discipline
    - '\bsdet\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  #
  # Gotchas:
  #  - No bare state codes (", ca" also matches "Toronto, Canada") and no bare
  #    "us" (matches "focus"). Full state names only.
  #  - "georgia" is left out on purpose: it also matches Tbilisi, Georgia.
  #    Atlanta/Savannah/Alpharetta cover the US state instead.
  locations:
    # country-level
    - united states
    - ' usa'
    - u.s.

